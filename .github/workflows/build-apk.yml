name: Build APK và đăng lên Releases

on:
  # Mỗi lần đẩy code (hoặc đẩy WidgetLich.zip mới) lên nhánh chính => tự build và đăng Releases.apk lên mục Releases
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phát hành (ví dụ v10.6.0). Để trống = lấy theo versionName trong app/build.gradle.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị mã nguồn
        id: src
        run: |
          if [ -f WidgetLich.zip ]; then
            rm -rf project && mkdir project
            unzip -q WidgetLich.zip -d project
            echo "dir=project" >> "$GITHUB_OUTPUT"
          elif [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Không thấy mã nguồn (cần WidgetLich.zip hoặc settings.gradle ở thư mục gốc repo)"
            exit 1
          fi

      - name: Xác định tag phát hành
        id: ver
        run: |
          D="${{ steps.src.outputs.dir }}"
          VN=$(grep -oP "versionName '\K[^']+" "$D/app/build.gradle" | head -1)
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VN:-0.0.0}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag phát hành: $TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug và Release
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file APK
        run: |
          D="${{ steps.src.outputs.dir }}"
          mkdir -p dist
          cp "$D/app/build/outputs/apk/release/app-release.apk" dist/Releases.apk
          cp "$D/app/build/outputs/apk/debug/app-debug.apk"     dist/Debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetLich-APK
          path: dist/*.apk

      - name: Đăng Releases.apk lên mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Widget Lịch ${{ steps.ver.outputs.tag }}
          files: |
            dist/Releases.apk
            dist/Debug.apk
          overwrite_files: true
          make_latest: true
