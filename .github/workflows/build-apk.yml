name: Build APK Widget Lich

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen WidgetLich.zip
        run: |
          if [ -f WidgetLich.zip ]; then
            rm -rf project && mkdir project
            unzip -q WidgetLich.zip -d project
          fi
          test -f project/settings.gradle || { echo "Khong thay project (can file WidgetLich.zip o thu muc goc repo)"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetLich-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
